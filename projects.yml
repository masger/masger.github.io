- title: "SAMSON-2 Trial"
  path: "#"
  description: "Investigator-initiated, nationwide, 11-center randomized controlled trial comparing a digital double-blind N-of-1 trial platform against guideline-directed standard care titration to systematically differentiate statin-associated muscle symptoms from expectation bias. Funded by the Capital Region of Denmark, Bispebjerg Hospital, and Hørslev-Fonden. Protocol approved in CTIS (2025-524955-30-01); protocol paper submitted to American Heart Journal in October 2026."
  role: "Sponsor & Principal Investigator"
  start: 2024

- title: "TDM-VISION"
  path: "#"
  description: "Prospective clinical research project evaluating therapeutic drug monitoring algorithms and pharmacokinetic-pharmacodynamic exposure metrics for targeted oral therapies (ibrutinib and venetoclax) in chronic lymphocytic leukemia. Funded by the Danish Cancer Society (DKK 2.3M)."
  role: "Principal Investigator"
  start: 2024

- title: "Cardiovascular Pharmacogenetics & Biobank Linkage"
  path: "#"
  description: "Deterministic individual-level linkage across Danish nationwide health registries and the Copenhagen Hospital Biobank (CHB) evaluating clinical outcomes associated with CYP2C19 loss-of-function variants in antiplatelet therapy, SLCO1B1-mediated statin uptake, and bedside clinical decision support."
  role: "Principal Investigator"
  start: 2025

- title: "SPOCK Trial & European PGx Networks"
  path: "#"
  description: "Multinational European clopidogrel pharmacogenomics consortium investigating CYP2C19 genotype-guided antiplatelet therapy, alongside active working group participation in COST Action CardioPharmGeneNet and CPIC guideline development."
  role: "Work Package Collaborator"
  start: 2022

- title: "OPTIMUS-AF"
  path: "#"
  description: "Nationwide, decentralised randomised trial (n = 520) in persistent or permanent atrial fibrillation with side effects attributed to rate-control therapy, comparing a double-blind double-dummy N-of-1 crossover of metoprolol versus verapamil against standard care. PI Morten Lamberts, Herlev and Gentofte Hospital. Funded by Independent Research Fund Denmark (2027 to 2031). Responsible for investigational medicinal product, N-of-1 methodology, and CYP2D6 and drug concentration analyses."
  role: "Co-applicant"
  start: 2027

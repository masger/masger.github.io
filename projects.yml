- title: "SAMSON-2 Trial"
  path: "#"
  description: "Investigator-initiated, nationwide, 11-center randomized controlled trial comparing a digital double-blind N-of-1 trial platform against guideline-directed standard care titration to systematically differentiate statin-associated muscle symptoms from expectation bias. Funded by the Capital Region of Denmark, Bispebjerg Hospital, and Hørslev-Fonden."
  role: "Sponsor & Principal Investigator"
  start: 2024

- title: "TDM-VISION"
  path: "#"
  description: "Prospective clinical research project evaluating therapeutic drug monitoring algorithms and pharmacokinetic-pharmacodynamic exposure metrics for targeted oral therapies (ibrutinib and venetoclax) in chronic lymphocytic leukemia. Funded by the Danish Cancer Society (DKK 2.3M)."
  role: "Principal Investigator"
  start: 2024

- title: "Cardiovascular Pharmacogenetics & Biobank Linkage"
  path: "#"
  description: "Deterministic individual-level linkage across Danish nationwide health registries and the Copenhagen Hospital Biobank (CHB) evaluating clinical outcomes associated with CYP2C19 loss-of-function variants in antiplatelet therapy, SLCO1B1-mediated statin uptake, and bedside clinical decision support."
  role: "Principal Investigator"
  start: 2025

- title: "SPOCK Trial & European PGx Consortia"
  path: "#"
  description: "Multinational European clopidogrel pharmacogenomics consortium (1,200 patients) investigating CYP2C19 genotype-guided therapy, alongside active working group participation in COST Action CardioPharmGeneNet and CPIC guideline development."
  role: "Co-investigator & Work Package Collaborator"
  start: 2022
